# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Apply lid/external-monitor mode once at Hyprland startup. The bindl lid
# switch events below only fire when the lid changes state, not when the
# laptop boots with the lid already closed.
exec-once = ~/.local/bin/lid-monitor-mode startup

# Watch monitor hotplug/removal events too. This fixes the closed-lid wake/dock
# path where the lid state does not change, so the bindl events never fire.
exec-once = uwsm-app -- ~/.local/bin/lid-monitor-mode-watch
