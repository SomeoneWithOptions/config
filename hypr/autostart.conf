# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = uwsm-app -- hyprsunset
exec-once = uwsm-app -- ~/.local/bin/omarchy-frame start

# Omarchy handles live lid and monitor-removal events. This targeted watcher
# covers booting already docked/closed and connecting a display while closed.
exec-once = uwsm-app -- ~/.local/bin/lid-monitor-mode-watch
