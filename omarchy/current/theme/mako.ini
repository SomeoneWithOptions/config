include=~/.local/share/omarchy/default/mako/core.ini

# Clean macOS-style notifications shared by all applications.
font=DM Sans 13px
width=380
height=116
outer-margin=18
margin=8
padding=14,18
border-size=0
border-radius=18
max-icon-size=42
icon-border-radius=11

text-color=#f5f5f7
background-color=#202024f2
progress-color=over #f5f5f733

[urgency=critical]
background-color=#2a2228f2
text-color=#f5f5f7
border-size=0
