# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Native panel setup for Lenovo NV160WUM-N4E (16:10 WUXGA).
# Best/sharpest resolution is the panel's native 1920x1200@60Hz.
env = GDK_SCALE,1
monitor=eDP-1,1920x1200@60,0x0,1.2

# BenQ MA320U external display (32" 4K). Keep native 4K@60Hz for sharpness.
# Match by EDID description so it works even if the connector changes (DP-2, HDMI-A-1, etc.).
monitor=desc:BNQ BenQ MA320U ET27S01282SL0,3840x2160@60,auto,1.5
# Current known port for the same monitor; harmless backup if description matching changes.
monitor=DP-2,3840x2160@60,auto,1.5

# Fallback for any other plugged-in external display.
# Keep this after specific monitor rules so known displays get their explicit scale.
monitor=,preferred,auto,auto

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# Or for ultrawide monitors like 34" 3440x1440 or 49" 5120x1440
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Portrait/rotated secondary monitor (transform: 1 = 90°, 3 = 270°)
# monitor = DP-2, preferred, auto, 1, transform, 1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# Disable the second ghost monitor on an Apple 6K XDR over Thunderbolt
# monitor=DP-2,disable
