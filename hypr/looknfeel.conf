# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
     border_size = 0

    # Allow resizing floating windows (including PiP) by grabbing their edges/corners.
    resize_on_border = true

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8

    # Squircle rather than a circular arc, so app top bars (Slack and Electron
    # apps generally) lose less content to the corner cut. At the frame's radius
    # of 18, the cut reaches more than 1px into the app's top row across the
    # first 12px at power 2, 8px at power 3, 6px at power 4.
    # Keep in sync with roundingPower in
    # ~/.config/quickshell/desktop-frame/FrameStyle.qml.
    rounding_power = 2.0
}

# Omarchy's default disables workspace switch animations
# (default/hypr/looknfeel.conf: `animation = workspaces, 0, 0, ease`). Re-enable
# here, since that file is git-managed and reset on `omarchy update`.
animations {
    animation = workspaces, 1, 5.5, easeOutQuint, slide
}

# The Omarchy menu (walker) is styled as a drawer of the desktop frame, so it
# should slide out of the black top strip. Omarchy's apps/walker.conf disables
# layer animations, so re-enable them first.
layerrule = no_anim off, match:namespace walker
layerrule = animation slide top, match:namespace walker

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
