include=~/.local/share/omarchy/default/mako/core.ini

# Clean macOS-inspired notifications: soft dark panel, no colored outline,
# generous spacing, rounded corners, and slightly larger rounded app icons.
font=sans-serif 13px
width=380
height=120
outer-margin=18
margin=8
padding=14,18
border-size=0
border-radius=14
max-icon-size=44
icon-border-radius=10

text-color=#f5f5f7
background-color=#1e1e2ee8
progress-color=over #f5f5f733

[urgency=critical]
background-color=#2a1f2de8
text-color=#f5f5f7
border-size=0
