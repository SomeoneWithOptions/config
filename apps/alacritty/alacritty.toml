general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
  size = 13.0
  normal = { family = "Azeret Mono" }

[window]
  opacity = 1.0
  decorations = "Buttonless"
  startup_mode = "Windowed"
  dimensions = { columns = 120, lines = 38 }
  padding = { x = 15, y = 15 }
  position = { x = 100, y = 200 }

[keyboard]
bindings = [
  { key = "Up", mods = "Shift", action = "ScrollPageUp" },
  { key = "Down", mods = "Shift", action = "ScrollPageDown" },
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
]
