# Learn how to configure Hyprland: https://wiki.hypr.land/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# Keep Alacritty fully solid. Omarchy's defaults make terminals slightly transparent.
windowrule = opacity 1.0 override 1.0 override, match:class ^Alacritty$

# Give btop enough room when launched from the shortcut/top-bar command.
# Omarchy's default floating TUI size is 875x600, which can be too cramped
# on this laptop once scaling and terminal font size are applied.
windowrule = size 1200 800, match:class ^org\.omarchy\.btop$
windowrule = center on, match:class ^org\.omarchy\.btop$

# Make 1Password tile like regular apps (Omarchy defaults tag it as floating)
windowrule = tag -floating-window, match:class ^(1[p|P]assword)$
windowrule = tile on, match:class ^(1[p|P]assword)$

# Let Zen Browser Picture-in-Picture behave like a regular movable floating window.
# Omarchy's default PiP rule pins it and opens it in the top-right corner.
windowrule = pin off, match:class ^zen$, match:title ^Picture-in-Picture$
windowrule = border_size 1, match:class ^zen$, match:title ^Picture-in-Picture$
windowrule = move cursor -50% -50%, match:class ^zen$, match:title ^Picture-in-Picture$

# Keep Zoom windows out of the tiling/grid layout so menus and dialogs behave better.
windowrule = float on, match:class ^([Zz]oom|zoom\.real)$
windowrule = tile off, match:class ^([Zz]oom|zoom\.real)$
windowrule = group deny, match:class ^([Zz]oom|zoom\.real)$
