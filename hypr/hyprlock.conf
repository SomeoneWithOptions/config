source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 4
    blur_size = 8
    brightness = 0.72
    vibrancy = 0.18
}

animations {
    enabled = true
}

label {
    monitor =
    text = $TIME12
    color = $font_color
    font_size = 82
    font_family = DM Sans
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    color = $font_color
    font_size = 20
    font_family = DM Sans
    position = 0, 175
    halign = center
    valign = center
    shadow_passes = 1
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = Andres
    color = $font_color
    font_size = 22
    font_family = DM Sans
    position = 0, 45
    halign = center
    valign = center
    shadow_passes = 1
    shadow_color = rgba(0, 0, 0, 0.35)
}

input-field {
    monitor =
    size = 360, 58
    position = 0, -35
    halign = center
    valign = center

    inner_color = rgba(20, 20, 24, 0.55)
    outer_color = rgba(255, 255, 255, 0.24)
    outline_thickness = 2

    font_family = DM Sans
    font_color = $font_color
    placeholder_text =
    check_color = $check_color
    fail_color = rgba(255, 90, 90, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = -1
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)
    dots_size = 0.18
    dots_spacing = 0.22
    fade_on_empty = false
}

label {
    monitor =
    text =  󰈷 
    color = $font_color
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 1
    shadow_color = rgba(0, 0, 0, 0.35)
}

auth {
    fingerprint:enabled = true
}
