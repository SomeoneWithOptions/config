# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
     border_size = 0

    # Allow resizing floating windows (including PiP) by grabbing their edges/corners.
    resize_on_border = true

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8
}

# The Omarchy menu (walker) is styled as a drawer of the desktop frame, so it
# should slide out of the black top strip. Omarchy's apps/walker.conf disables
# layer animations, so re-enable them first.
layerrule = no_anim off, match:namespace walker
layerrule = animation slide top, match:namespace walker

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}
