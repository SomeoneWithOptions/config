general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake && ~/.local/bin/lid-monitor-mode startup    # wake display, then re-apply closed-lid external monitor mode if needed.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 5 minutes
listener {
    timeout = 300
    on-timeout = pidof hyprlock || ~/.local/bin/matrix-launch-screensaver
}

# Lock system after 10 minutes
listener {
    timeout = 600
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}

# Suspend after 15 minutes of idle only while unplugged.
listener {
    timeout = 900
    on-timeout = test "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "0" && systemctl suspend
}
