<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Azeret Mono 1.002 ships 1300-wide glyphs (½ IJ —) and, in the italics, a
       few off-by-a-few advances (d=653), so fontconfig tags the upright faces
       dual and the italics proportional. Ghostty asks for spacing=mono without
       a slant, which then ranks Italic above Regular. Scan-time rule: needs
       fc-cache -f to take effect (scripts/apply/settings.sh does that). -->
  <match target="scan">
    <test name="family">
      <string>Azeret Mono</string>
    </test>
    <edit name="spacing" mode="assign">
      <const>mono</const>
    </edit>
  </match>
  <!-- Backstop for any unpatched Azeret Mono copy: the vendored fonts already
       have liga/calt/dlig emptied (see fonts/strip-ligatures.py), because Qt
       ignores fontfeatures and this rule alone never reached the shell menu. -->
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Azeret Mono</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>liga off</string>
    </edit>
    <edit name="fontfeatures" mode="append">
      <string>calt off</string>
    </edit>
    <edit name="fontfeatures" mode="append">
      <string>dlig off</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Menlo</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <!-- prepend_first, not assign: 50-omarchy.conf loads first and assigns
         monospace -> JetBrainsMono Nerd Font, which an assign here loses to. -->
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Azeret Mono</string>
    </edit>
  </match>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>DM Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>DM Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>DM Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <!-- Mac font substitutes: use free/local equivalents when sites request these names. -->
  <alias>
    <family>Times</family>
    <prefer>
      <family>Nimbus Roman</family>
    </prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Nimbus Roman</family>
    </prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer>
      <family>Nimbus Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>Helvetica Neue</family>
    <prefer>
      <family>Nimbus Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>Menlo</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DM Sans</family>
    </prefer>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
